# 2核2G 测试机的 PostgreSQL 压内存调参
# 用法：把这些行追加到 postgresql.conf（数据目录下），重启 postgresql 生效。
# 目标：PG 常驻控制在 ~400MB 内，给 Grafana / worker / OS 留出空间。

shared_buffers = 256MB            # 约内存 1/8，别再大
effective_cache_size = 768MB      # 仅供查询规划器估算，不实占内存
work_mem = 8MB                    # 单次排序/哈希内存；连接少可适当给
maintenance_work_mem = 64MB
max_connections = 30              # 测试机够用，连接越多越吃内存

# 测试机可关同步提交换吞吐（掉电可能丢最后几帧，测试无所谓；生产别这么设）
synchronous_commit = off
wal_compression = on

# 监听本机即可；公网访问 PG 一律走安全组挡掉，别开 0.0.0.0
listen_addresses = 'localhost'
