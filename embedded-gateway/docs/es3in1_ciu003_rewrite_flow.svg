  <path class="thin" d="M 1050 995 C 1265 1018 1410 1018 1500 1018"/>
  <text class="label" x="1300" y="1040">否，继续主循环</text>
  <path class="line" d="M 1930 378 L 2020 378"/>
  <path class="line" d="M 1715 456 L 1715 610"/>
