  <path class="line" d="M 1050 1341 C 1050 1430 1885 1430 1885 1545"/>
  <path class="line" d="M 1050 1341 C 1050 1430 2300 1430 2300 1545"/>

  <path class="line" d="M 385 1795 L 385 1905"/>
