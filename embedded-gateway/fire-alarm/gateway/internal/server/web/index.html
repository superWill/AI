<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>消防控制室图形显示装置</title>
<style>
:root{
  --bg:#0d1117; --panel:#151b24; --panel-2:#1b2230; --line:#232c3b;
  --ink:#e8edf5; --muted:#8b98ab;
  --red:#ff3b30; --red-dim:#5c1b18; --amber:#ffb020; --amber-dim:#4a3308;
  --green:#32d74b; --green-dim:#13381b; --blue:#4da3ff;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;
  background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:16px;margin:0;letter-spacing:.5px;font-weight:600}
.sub{color:var(--muted);font-size:12px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  font-size:12px;border:1px solid var(--line);background:var(--panel-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}
.dot.bad{background:var(--red);box-shadow:0 0 8px var(--red);animation:blink 1s steps(2,end) infinite}
@keyframes blink{50%{opacity:.25}}
#clock{font-family:var(--mono);font-variant-numeric:tabular-nums}

main{padding:16px 20px 32px;max-width:1400px;margin:0 auto}
.counters{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.c{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  position:relative;overflow:hidden}
.c .n{font-size:34px;font-weight:700;line-height:1;font-family:var(--mono);
  font-variant-numeric:tabular-nums}
.c .l{color:var(--muted);font-size:12px;margin-top:6px}
.c::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--line)}
.c.hot::before{background:var(--red)}
.c.hot{background:linear-gradient(90deg,var(--red-dim),var(--panel) 60%)}
.c.hot .n{color:var(--red)}
.c.warn::before{background:var(--amber)}
.c.warn{background:linear-gradient(90deg,var(--amber-dim),var(--panel) 60%)}
.c.warn .n{color:var(--amber)}

.first{margin-top:12px;border:1px solid var(--red);border-radius:10px;padding:12px 16px;
  background:linear-gradient(90deg,var(--red-dim),var(--panel) 70%);display:none}
.first.on{display:block}
.first b{color:var(--red);letter-spacing:1px}

.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;margin-top:14px}
@media(max-width:980px){.grid{grid-template-columns:1fr}.counters{grid-template-columns:repeat(3,1fr)}}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.hd{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);
  background:var(--panel-2)}
.hd h2{font-size:13px;margin:0;font-weight:600;letter-spacing:.5px}
.hd .cnt{color:var(--muted);font-size:12px}
.body{max-height:460px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--panel-2);color:var(--muted);font-weight:500;
  text-align:left;padding:7px 12px;font-size:12px;border-bottom:1px solid var(--line);z-index:1}
td{padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.tag{display:inline-block;padding:1px 8px;border-radius:5px;font-size:12px;white-space:nowrap;
  border:1px solid transparent}
.t-火警,.t-监管,.t-启动,.t-反馈{color:var(--red);background:var(--red-dim);border-color:#7a2a25}
.t-故障,.t-屏蔽{color:var(--amber);background:var(--amber-dim);border-color:#6b4a10}
.t-复位,.t-电源{color:var(--green);background:var(--green-dim);border-color:#1e5c2c}
.st{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:#2c3646}
.st.alarm{background:var(--red);box-shadow:0 0 7px var(--red)}
.st.fault{background:var(--amber);box-shadow:0 0 7px var(--amber)}
.st.ok{background:var(--green)}
.st.shield{background:#6b7280}
.muted{color:var(--muted)}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}

.tabs{display:flex;gap:6px;margin-left:auto}
.tab{padding:3px 10px;border-radius:6px;font-size:12px;cursor:pointer;color:var(--muted);
  border:1px solid transparent;background:none}
.tab.on{color:var(--ink);background:var(--panel);border-color:var(--line)}
button.act{padding:5px 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);
  color:var(--ink);font-size:12px;cursor:pointer;font-family:inherit}
button.act:hover{border-color:var(--blue);color:var(--blue)}
button.act:active{transform:translateY(1px)}
.hex{font-family:var(--mono);font-size:11.5px;color:#7fd4a0;word-break:break-all;line-height:1.5}
.dir-上行{color:var(--blue)} .dir-下行{color:var(--amber)}
</style>
</head>
<body>
<header>
  <h1>消防控制室图形显示装置</h1>
  <span class="sub">CRT · 火灾报警控制器上位机</span>
  <div class="spacer"></div>
  <span class="pill"><span class="dot" id="d-link"></span><span id="t-link">链路未连接</span></span>
  <span class="pill"><span class="dot" id="d-main"></span>主电</span>
  <span class="pill"><span class="dot" id="d-batt"></span>备电</span>
  <span class="pill" id="clock">--:--:--</span>
  <button class="act" onclick="cmd('timesync')">授时</button>
  <button class="act" onclick="cmd('selftest')">自检</button>
  <button class="act" onclick="cmd('reset')">复位</button>
</header>

<main>
  <div class="counters" id="counters"></div>

  <div class="first" id="first">
    <b>首 火 警</b>
    <span id="first-body" style="margin-left:14px"></span>
  </div>

  <div class="grid">
    <section>
      <div class="hd">
        <h2>事件记录</h2><span class="cnt" id="ev-cnt"></span>
        <div class="tabs" id="ev-tabs"></div>
      </div>
      <div class="body"><table id="events"><thead><tr>
        <th style="width:82px">时间</th><th style="width:64px">类型</th>
        <th style="width:78px">部位</th><th>说明</th></tr></thead><tbody></tbody></table>
        <div class="empty" id="ev-empty">暂无事件</div>
      </div>
    </section>

    <section>
      <div class="hd">
        <h2>点位状态</h2><span class="cnt" id="dv-cnt"></span>
        <div class="tabs">
          <button class="tab on" data-view="devices" onclick="setView('devices')">点表</button>
          <button class="tab" data-view="frames" onclick="setView('frames')">报文</button>
        </div>
      </div>
      <div class="body" id="pane-devices"><table id="devices"><thead><tr>
        <th style="width:74px">部位</th><th>名称</th><th style="width:150px">状态</th></tr></thead><tbody></tbody></table>
        <div class="empty" id="dv-empty">尚未收到任何点位上报</div>
      </div>
      <div class="body" id="pane-frames" style="display:none"></div>
    </section>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
let snap = null, filter = '全部', view = 'devices';

const KINDS = ['全部','火警','监管','启动','反馈','故障','屏蔽','复位','电源'];
$('#ev-tabs').innerHTML = KINDS.map(k =>
  `<button class="tab${k==='全部'?' on':''}" onclick="setFilter('${k}')">${k}</button>`).join('');

function setFilter(k){
  filter = k;
  document.querySelectorAll('#ev-tabs .tab').forEach(b =>
    b.classList.toggle('on', b.textContent === k));
  renderEvents();
}
function setView(v){
  view = v;
  document.querySelectorAll('[data-view]').forEach(b =>
    b.classList.toggle('on', b.dataset.view === v));
  $('#pane-devices').style.display = v === 'devices' ? '' : 'none';
  $('#pane-frames').style.display = v === 'frames' ? '' : 'none';
  if (v === 'frames') loadFrames();
}
async function cmd(name){
  const r = await fetch('/api/cmd/' + name, {method:'POST'}).catch(()=>null);
  if(!r || !r.ok){ const j = r ? await r.json().catch(()=>({})) : {};
    alert('命令未下发：' + (j.error || '链路不可用')); }
}
const hhmmss = t => new Date(t).toLocaleTimeString('zh-CN', {hour12:false});
const pos = (l,a) => (l||a) ? `${l}回路 ${String(a).padStart(3,'0')}` : '本机';

const CDEF = [
  ['火警','alarm','hot'], ['监管','supervisory','hot'], ['启动','action','hot'],
  ['反馈','feedback','hot'], ['故障','fault','warn'], ['屏蔽','shielded','warn'],
];
function renderCounters(){
  const c = snap.counters;
  $('#counters').innerHTML = CDEF.map(([label,key,cls]) => {
    const n = c[key] || 0;
    return `<div class="c${n>0?' '+cls:''}"><div class="n">${n}</div><div class="l">${label}</div></div>`;
  }).join('');
}
function renderFirst(){
  const f = snap.first_alarm, el = $('#first');
  if(!f){ el.classList.remove('on'); return; }
  el.classList.add('on');
  $('#first-body').innerHTML =
    `<span class="mono">${hhmmss(f.at)}</span> · ${pos(f.loop,f.addr)}`
    + (f.zone ? ` · ${f.zone}分区` : '') + ` · ${f.detail}`;
}
function renderEvents(){
  const rows = (snap.events||[]).filter(e => filter==='全部' || e.kind===filter);
  $('#ev-cnt').textContent = rows.length ? `${rows.length} 条` : '';
  $('#ev-empty').style.display = rows.length ? 'none' : '';
  $('#events').style.display = rows.length ? '' : 'none';
  $('#events tbody').innerHTML = rows.map(e => `<tr>
    <td class="mono">${hhmmss(e.at)}</td>
    <td><span class="tag t-${e.kind}">${e.kind}</span></td>
    <td class="mono">${pos(e.loop,e.addr)}</td>
    <td>${e.detail||''}</td></tr>`).join('');
}
function stateCell(d){
  const out = [];
  if(d.alarm)       out.push(`<span class="st alarm"></span>${d.manual?'手报':'火警'}`);
  if(d.supervisory) out.push(`<span class="st alarm"></span>监管`);
  if(d.action)      out.push(`<span class="st alarm"></span>启动`);
  if(d.feedback)    out.push(`<span class="st alarm"></span>反馈`);
  if(d.fault_flags) out.push(`<span class="st fault"></span>${faultText(d.fault_flags)}`);
  if(d.shielded)    out.push(`<span class="st shield"></span>屏蔽`);
  return out.length ? out.join(' ') : `<span class="st ok"></span><span class="muted">正常</span>`;
}
const faultText = f => [[1,'断路'],[2,'短路'],[4,'失联'],[8,'响应非法']]
  .filter(([b]) => f & b).map(([,t]) => t).join('/');

function renderDevices(){
  const ds = snap.devices || [];
  $('#dv-cnt').textContent = ds.length ? `${ds.length} 点` : '';
  $('#dv-empty').style.display = ds.length ? 'none' : '';
  $('#devices').style.display = ds.length ? '' : 'none';
  $('#devices tbody').innerHTML = ds.map(d => `<tr>
    <td class="mono">${pos(d.loop,d.addr)}</td>
    <td>${d.name || '<span class="muted">未命名</span>'}
        ${d.type ? `<span class="muted"> · ${d.type}</span>` : ''}</td>
    <td>${stateCell(d)}</td></tr>`).join('');
}
async function loadFrames(){
  const r = await fetch('/api/frames').catch(()=>null);
  if(!r) return;
  const fs = await r.json();
  $('#pane-frames').innerHTML = (fs && fs.length) ? fs.map(f => `
    <div style="padding:8px 14px;border-bottom:1px solid var(--line)">
      <div><span class="mono">${hhmmss(f.at)}</span>
        <span class="dir-${f.dir}">${f.dir}</span>
        <b>${f.type}</b> <span class="muted">SEQ=${f.seq}</span>
        ${f.err ? `<span style="color:var(--red)"> ${f.err}</span>` : ''}</div>
      ${f.hex ? `<div class="hex">${f.hex.toUpperCase().replace(/(..)/g,'$1 ')}</div>` : ''}
    </div>`).join('') : '<div class="empty">尚未收发任何报文</div>';
}

function render(){
  if(!snap) return;
  const up = snap.link_up;
  $('#d-link').className = 'dot ' + (up ? 'ok' : 'bad');
  $('#t-link').textContent = up ? '链路正常' : '链路故障';
  $('#d-main').className = 'dot ' + (snap.main_ok ? 'ok' : 'bad');
  $('#d-batt').className = 'dot ' + (snap.battery_ok ? 'ok' : 'bad');
  renderCounters(); renderFirst(); renderEvents(); renderDevices();
  if(view === 'frames') loadFrames();
}

setInterval(() => $('#clock').textContent =
  new Date().toLocaleTimeString('zh-CN',{hour12:false}), 1000);

// SSE：状态一变服务端就推，断线后自动重连。
function connect(){
  const es = new EventSource('/api/stream');
  es.onmessage = e => { snap = JSON.parse(e.data); render(); };
  es.onerror = () => { es.close(); setTimeout(connect, 2000); };
}
connect();
</script>
</body>
</html>
